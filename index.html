<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
.slide {
position: absolute;
inset: 0;
opacity: 0;
}
.slide.active { opacity: 1; }
.slide img {
width: 100%;
height: 100%;
object-fit: contain;
}
</style>
</head>
<body>
<div class="slide active"><img src="LA ARGENTA 916 tablet.jpg"></div>
<div class="slide"><img src="almedrata 916.jpeg"></div>
<div class="slide"><img src="combo la nuestra 916.jpg"></div>
<div class="slide"><img src="combo marga 916.jpg"></div>
<div class="slide"><img src="panino jamon y queso 916.jpg"></div>
<div class="slide"><img src="la tricolore 916.jpg"></div>
<script>
const slides = document.querySelectorAll('.slide');
let current = 0;
setInterval(() => {
slides[current].classList.remove('active');
current = (current + 1) % slides.length;
slides[current].classList.add('active');
}, 5000);
</script>
</body>
</html>
